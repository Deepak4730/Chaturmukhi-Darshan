name: Sync Notion articles

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Notion database to static HTML pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync generated articles from Notion"
          git push
import fs from 'node:fs/promises';
import path from 'node:path';

const NOTION_TOKEN = process.env.NOTION_TOKEN;
const DATABASE_ID = process.env.NOTION_DATABASE_ID;

if (!NOTION_TOKEN || !DATABASE_ID) {
  throw new Error('Missing NOTION_TOKEN or NOTION_DATABASE_ID environment variables.');
}

const rootDir = process.cwd();
const postsDir = path.join(rootDir, 'posts');

const escapeHtml = (value) =>
  String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

const getTextFromProperty = (property) => {
  if (!property) return '';
  if (Array.isArray(property)) return property.map((item) => getTextFromProperty(item)).join(' ');
  if (typeof property === 'string') return property;

  if (property.type === 'title' || property.type === 'rich_text' || property.type === 'text') {
    return property[property.type]?.map((item) => item.plain_text || '').join(' ') ?? '';
  }

  if (property.type === 'select') return property.select?.name ?? '';
  if (property.type === 'date') return property.date?.start ?? '';
  if (property.type === 'number') return String(property.number ?? '');
  if (property.type === 'url') return property.url ?? '';
  if (property.type === 'multi_select') return property.multi_select?.map((opt) => opt.name).join(', ') ?? '';
  if (property.type === 'people') return property.people?.map((person) => person.name || person.id).join(', ') ?? '';
  if (property.type === 'checkbox') return property.checkbox ? 'Yes' : 'No';

  return '';
};

const getPropertyValue = (page, matchName) => {
  const property = Object.values(page.properties || {}).find((item) => {
    const name = item?.name || '';
    return name.toLowerCase() === matchName.toLowerCase();
  });
  if (!property) return '';
  return getTextFromProperty(property);
};

const getPageTitle = (page) => {
  const title = Object.values(page.properties || {}).find((property) => property.type === 'title');
  return getTextFromProperty(title) || 'Untitled Article';
};

const getPageDescription = (page) => {
  return (
    getPropertyValue(page, 'summary') ||
    getPropertyValue(page, 'description') ||
    getPropertyValue(page, 'excerpt') ||
    'A reflection from Chaturmukhi Darshan.'
  );
};

const getPageCategory = (page) => {
  return getPropertyValue(page, 'category') || getPropertyValue(page, 'topic') || 'Essay';
};

const getPageDate = (page) => {
  return getPropertyValue(page, 'date') || getPropertyValue(page, 'published') || new Date().toISOString().slice(0, 10);
};

const renderRichText = (texts = []) => texts.map((item) => {
  const text = item.plain_text || '';
  if (!text) return '';
  if (item.href) {
    return `<a href="${escapeHtml(item.href)}" target="_blank" rel="noreferrer noopener">${escapeHtml(text)}</a>`;
  }
  return escapeHtml(text);
}).join('');

const renderBlock = (block) => {
  if (!block) return '';
  const type = block.type;

  switch (type) {
    case 'paragraph':
      return `<p>${renderRichText(block.paragraph.rich_text)}</p>`;
    case 'heading_1':
      return `<h2>${renderRichText(block.heading_1.rich_text)}</h2>`;
    case 'heading_2':
      return `<h3>${renderRichText(block.heading_2.rich_text)}</h3>`;
    case 'heading_3':
      return `<h4>${renderRichText(block.heading_3.rich_text)}</h4>`;
    case 'quote':
      return `<blockquote>${renderRichText(block.quote.rich_text)}</blockquote>`;
    case 'divider':
      return '<hr>';
    case 'code':
      return `<pre><code>${escapeHtml(block.code.rich_text.map((t) => t.plain_text).join('\n'))}</code></pre>`;
    case 'callout':
      return `<blockquote>${renderRichText(block.callout.rich_text)}</blockquote>`;
    case 'bookmark':
      return `<p><a href="${escapeHtml(block.bookmark.url)}" target="_blank" rel="noreferrer noopener">${escapeHtml(block.bookmark.url)}</a></p>`;
    case 'bulleted_list_item':
      return `<li>${renderRichText(block.bulleted_list_item.rich_text)}</li>`;
    case 'numbered_list_item':
      return `<li>${renderRichText(block.numbered_list_item.rich_text)}</li>`;
    default:
      return '';
  }
};

const renderBlocks = (blocks = []) => {
  let output = '';
  let listType = null;
  const listItems = [];

  const flushList = () => {
    if (!listItems.length) return '';
    const tag = listType === 'numbered' ? 'ol' : 'ul';
    const html = listItems.join('');
    listItems.length = 0;
    listType = null;
    return `<${tag}>${html}</${tag}>`;
  };

  for (const block of blocks) {
    const type = block.type;
    if (type === 'bulleted_list_item' || type === 'numbered_list_item') {
      const candidateType = type === 'bulleted_list_item' ? 'bulleted' : 'numbered';
      if (listType && listType !== candidateType) {
        output += flushList();
      }
      listType = candidateType;
      listItems.push(renderBlock(block));
      continue;
    }

    if (listItems.length) {
      output += flushList();
    }
    output += renderBlock(block);
  }

  if (listItems.length) {
    output += flushList();
  }

  return output;
};

async function fetchJson(url, options = {}) {
  const response = await fetch(url, {
    headers: {
      Authorization: `Bearer ${NOTION_TOKEN}`,
      'Notion-Version': '2022-06-28',
      ...(options.headers || {}),
    },
    ...options,
  });

  if (!response.ok) {
    const body = await response.text();
    throw new Error(`Notion API request failed (${response.status}): ${body}`);
  }

  return response.json();
}

async function getBlockChildren(blockId, cursor = null, collected = []) {
  const url = new URL(`https://api.notion.com/v1/blocks/${blockId}/children`);
  url.searchParams.set('page_size', '100');
  if (cursor) url.searchParams.set('start_cursor', cursor);

  const data = await fetchJson(url.toString());
  collected.push(...data.results);

  if (data.has_more) {
    return getBlockChildren(blockId, data.next_cursor, collected);
  }

  return collected;
}

const slugify = (value) => String(value || '')
  .trim()
  .toLowerCase()
  .replace(/[^a-z0-9]+/g, '-')
  .replace(/^-+|-+$/g, '');

