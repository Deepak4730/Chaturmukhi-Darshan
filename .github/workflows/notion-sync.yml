  <script>
    (() => {
      const root = document.documentElement;
      const dotField = document.getElementById('floating-dots');
      const themeToggle = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      let rafId = 0;
      function setTheme(theme) {
        root.dataset.theme = theme;
        const dark = theme === 'dark';
        themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        themeIcon.innerHTML = dark
          ? '<path d=\"M20.2 15.1A8.4 8.4 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z\"/>'
          : '<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42\"/>';
        document.querySelector('meta[name=\"theme-color\"]').setAttribute('content', dark ? '#1f1d26' : '#e2dfeb');
      }
      function makeDots() {
        cancelAnimationFrame(rafId);
        dotField.replaceChildren();
        const canvas = document.createElement('canvas');
        dotField.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const W = window.innerWidth, H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.scale(dpr, dpr);
        const count = Math.round(Math.min(500, Math.max(120, (W * H) / 1400)));
        const stars = [];
        for (let i = 0; i < count; i++) {
          const r = Math.random();
          const size = r < 0.72 ? 0.5 + Math.random() * 0.7 : r < 0.95 ? 1.2 + Math.random() * 0.8 : 2 + Math.random() * 1.3;
          stars.push({ x: Math.random() * W, y: Math.random() * H, size, big: size > 1.9, tint: Math.random(), vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 3.5, base: 0.4 + Math.random() * 0.55, speed: 0.25 + Math.random() * 0.6, phase: Math.random() * 6.28 });
        }
        function color(star, dark) { if (dark) return star.tint < 0.4 ? '196,170,245' : star.tint < 0.75 ? '176,148,235' : '214,190,250'; return star.tint < 0.4 ? '104,70,172' : star.tint < 0.75 ? '124,90,190' : '88,56,150'; }
        let last = performance.now();
        function frame(now) {
          const dt = Math.min((now - last) / 1000, 0.05); last = now;
          const dark = root.dataset.theme === 'dark';
          ctx.clearRect(0, 0, W, H);
          for (const st of stars) {
            if (!reduced) {
              st.x += st.vx * dt; st.y += st.vy * dt;
              if (st.x < -4) st.x = W + 4; else if (st.x > W + 4) st.x = -4;
              if (st.y < -4) st.y = H + 4; else if (st.y > H + 4) st.y = -4;
            }
            const tw = reduced ? 1 : 0.72 + 0.28 * Math.sin(now / 1000 * st.speed + st.phase);
            const a = Math.min(1, st.base * tw);
            const c = color(st, dark);
            if (st.big) {
              const g = ctx.createRadialGradient(st.x, st.y, 0, st.x, st.y, st.size * 4);
              g.addColorStop(0, `rgba(${c},${a})`);
              g.addColorStop(1, `rgba(${c},0)`);
              ctx.fillStyle = g;
              ctx.beginPath(); ctx.arc(st.x, st.y, st.size * 4, 0, 6.2832); ctx.fill();
            }
            ctx.fillStyle = `rgba(${c},${a})`;
            ctx.beginPath(); ctx.arc(st.x, st.y, st.size, 0, 6.2832); ctx.fill();
          }
          if (!reduced) rafId = requestAnimationFrame(frame);
        }
        rafId = requestAnimationFrame(frame);
      }
      themeToggle.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('cd-theme'); } catch (_) {}
      setTheme(savedTheme === 'dark' ? 'dark' : 'light');
      makeDots();
    })();
  </script>
</body>
</html>`;

