name: Build article posts

on:
  push:
    paths:
      - "posts/*.md"
      - "scripts/build-posts.js"
      - ".github/workflows/build-posts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure package.json exists and install dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install marked

      - name: Build posts
        run: node scripts/build-posts.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "Update generated posts"
            git push
          fi
